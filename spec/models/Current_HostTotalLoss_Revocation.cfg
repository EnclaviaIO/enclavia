\* Full host adversary, upgrade A->B revoked by the owner (honest backend). 
\* Finding F1c: after a total loss the running A silently re-registers its 
\* current state on the fresh cluster (a Pin on an unknown key becomes 
\* Register, the client adopts version 0), the revocation state is gone, and 
\* the revoked link moves the real data to B. SuccessorMustTransition 
\* isolates this from F2.
\* EXPECT: violation RevocationPermanentData
\* TIER: heavy
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssNone
    VfVals <- VfNone
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 3
    MaxDisasters = 1
    AckPolicy = "quorum"
    AllowTotalLoss = TRUE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = FALSE
    CliChecks = "revocation"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = TRUE
    ExplicitRegister = FALSE
INVARIANTS
    RevocationPermanentData

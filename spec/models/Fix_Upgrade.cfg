\* Fixes for F2 and the revocation design: an image built as an upgrade 
\* target never registers fresh; revocation keyed by the link hash, CLI 
\* decodes and checks what it signs, strict payload types. Hostile backend. 
\* Documented precondition.
\* EXPECT: pass
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssTwo
    VfVals <- VfZero
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 3
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = TRUE
    CliChecks = "decode"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = TRUE
    ExplicitRegister = FALSE
INVARIANTS
    NoRollback
    NoStaleRestore
    NoFork
    TransitionAuthorized
    RevocationPermanent
    OwnerOnly
    AckDurability
    LeaderCompleteness

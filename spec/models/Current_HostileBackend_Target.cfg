\* Train 2 as built with a HOSTILE backend. Finding F7 (target variant): the 
\* CLI signs the upgrade payload bytes it is handed without decoding them 
\* (only revocations are checked), so the backend obtains the owner's 
\* signature over an upgrade A->C although the owner approved A->B. No 
\* enclave-side check looks at to_pcrs.
\* EXPECT: violation TransitionAuthorized
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesThree
    Links <- LinksOne
    IssVals <- IssNone
    VfVals <- VfNone
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 3
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = TRUE
    CliChecks = "revocation"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    TransitionAuthorized

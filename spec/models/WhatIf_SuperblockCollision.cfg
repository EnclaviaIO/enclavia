\* What-if: two forks write byte-identical superblocks (same generation and 
\* allocation, different content), so the pinned hash does not tell them 
\* apart; the CAS disambiguation Get accepts the loser's pin as its own.
\* EXPECT: violation NoFork
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesOne
    Links <- LinksNone
    IssVals <- IssNone
    VfVals <- VfNone
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 0
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 4
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = FALSE
    CliChecks = "revocation"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "shape"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    NoFork

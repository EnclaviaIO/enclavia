\* What-if on the planned fix: link-hash revocation and a CLI that 
\* decodes/checks, but payload types are NOT separated (serde ignores 
\* unknown fields). A hostile backend makes the revocation bytes also decode 
\* as an upgrade payload; the old enclave attests them while processing the 
\* revoke.
\* EXPECT: violation TransitionAuthorized
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssTwo
    VfVals <- VfZero
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 3
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = TRUE
    CliChecks = "decode"
    StrictPayloads = FALSE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    TransitionAuthorized

\* Negative (bd673c2, superseded by f413b5e): per-key watermark on the 
\* backend-stamped issued_at. Even with a CLI that decodes and checks 
\* everything it signs, a hostile backend future-dates the link or 
\* back-dates the revocation; the revocation commits but does not cover the 
\* link.
\* EXPECT: violation RevocationPermanent
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssTwo
    VfVals <- VfZero
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 4
    MaxInst = 3
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "watermark"
    HostileBackend = TRUE
    CliChecks = "decode"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    RevocationPermanent

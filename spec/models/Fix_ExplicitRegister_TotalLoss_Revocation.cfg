\* Same fixes, strict RevocationPermanent: after a total loss the host 
\* registers the old image on a blank volume and replays the revoked link. 
\* Only a blank volume moves, but the revoked successor runs as the 
\* lineage's successor; closing this needs the oracle's continuity to be 
\* verifiable (#122).
\* EXPECT: violation RevocationPermanent
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssNone
    VfVals <- VfNone
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 3
    MaxDisasters = 1
    AckPolicy = "quorum"
    AllowTotalLoss = TRUE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "watermark"
    HostileBackend = FALSE
    CliChecks = "none"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = TRUE
    ExplicitRegister = TRUE
INVARIANTS
    RevocationPermanent

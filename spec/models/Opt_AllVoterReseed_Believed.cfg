\* Optional: all-voter ACK plus re-seed from a node that BELIEVES it is a 
\* voter (an instance replaced while the host partitioned it).
\* EXPECT: violation AckDurability
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesOne
    Links <- LinksNone
    IssVals <- IssNone
    VfVals <- VfNone
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 0
    Tol = 1
    MaxLog = 4
    MaxOps = 5
    MaxInst = 4
    MaxDisasters = 1
    AckPolicy = "all"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "watermark"
    HostileBackend = FALSE
    CliChecks = "none"
    StrictPayloads = TRUE
    Reseed = "believed"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    AckDurability

\* Fixes for F7 and F8 under a hostile backend: link-hash revocation 
\* (f413b5e), the CLI decodes and checks upgrade payloads too, strict 
\* payload types.
\* EXPECT: pass
\* TIER: heavy
SPECIFICATION Spec
CONSTANTS
    Images <- ImagesTwo
    Links <- LinksOne
    IssVals <- IssTwo
    VfVals <- VfZero
    LinkIds <- LinkIdsOne
    MaxState = 2
    MaxBoot = 2
    MaxTime = 2
    Tol = 1
    MaxLog = 4
    MaxOps = 4
    MaxInst = 3
    MaxDisasters = 0
    AckPolicy = "quorum"
    AllowTotalLoss = FALSE
    Shadow = FALSE
    DevTrusted = FALSE
    ValidFromGate = TRUE
    RevocationMode = "linkhash"
    HostileBackend = TRUE
    CliChecks = "decode"
    StrictPayloads = TRUE
    Reseed = "none"
    ClientVersionCheck = FALSE
    CommitMode = "injective"
    SuccessorMustTransition = FALSE
    ExplicitRegister = FALSE
INVARIANTS
    TransitionAuthorized
    RevocationPermanent
    OwnerOnly

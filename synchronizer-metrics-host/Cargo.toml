# Host-side crate: runs on a synchronizer node's parent instance, never in
# an enclave.

[package]
name = "synchronizer-metrics-host"
# Reference receiver for the deployment repo, not part of the crates.io
# publish set.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side receiver for the synchronizer's one-way metrics frames: reads one bounded frame per connection and writes it as Prometheus text for node_exporter's textfile collector."

[dependencies]
enclavia-protocol = { path = "../enclavia-protocol", default-features = false, features = ["async-transport"] }
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt", "time"] }
tokio-vsock = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "synchronizer-metrics-host"
path = "src/main.rs"

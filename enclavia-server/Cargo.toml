# In-enclave crate: runs inside the VM (real Nitro or QEMU) and reaches
# the host unconditionally via tokio-vsock. No debug/enclave feature
# split. See "Transport conventions" in CLAUDE.md before adding any
# transport-related feature here.

[package]
name = "enclavia-server"
# In-enclave/dev binary, not part of the crates.io publish set (the SDK,
# protocol, and CLI are). Flip deliberately if that ever changes.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-enclave Noise responder: terminates the encrypted channel and forwards plaintext to the inner container."

[features]
default = []
# Validate the synchronizer's attestation without the AWS Nitro certificate
# chain (QEMU deployments, whose NSM self-signs). Only debug images carry a
# build with it (the flake's `enclavia-server-debug`); production images
# carry the default build, which does not contain the path. At startup the
# measured `synchronizer.debug_attestation` must equal whether the feature is
# compiled in, or the server refuses to start.
dangerous-skip-chain = ["synchronizer/dangerous-skip-chain"]

[dependencies]
# `nsm`: this enclave's own documents, through
# `ValidatedAttestation::request_local`.
enclavia-protocol = { path = "../enclavia-protocol", features = ["nsm"] }
enclavia-vsock = { path = "../enclavia-vsock" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ciborium.workspace = true
serde.workspace = true
serde_json.workspace = true
# ECDSA P-256 for verifying signed `ControlCommand`s from the backend
# (#47). The pubkey is read from `enclavia-config.json` at startup as
# 65-byte uncompressed SEC1; signatures are 64-byte raw r||s.
p256 = { workspace = true }
rand.workspace = true
base64.workspace = true
sha2.workspace = true
# Own-clock enforcement of the measured minimum upgrade delay
# (`UpgradePayload.valid_from` floor in `run_prepare_upgrade`).
chrono = { workspace = true }
tokio-vsock = { workspace = true }
# Customer-side synchronizer client: the RevokeUpgrade flow commits the
# revocation to the synchronizer (for enclaves that pin storage there)
# before reporting it done. The `client` feature carries no mesh / openraft.
synchronizer = { path = "../synchronizer", features = ["client"] }

[[bin]]
name = "enclavia-server"
path = "src/main.rs"

[dev-dependencies]
uuid = { workspace = true }
# Fake attestation documents for the revoke-flow tests' scripted
# synchronizer.
enclavia-protocol = { path = "../enclavia-protocol", features = ["test-utils"] }
# The revoke-flow tests authenticate that synchronizer's fake documents
# without the certificate chain. Tests only: this crate's own build flavour
# (its `dangerous-skip-chain` feature) stays the default one.
synchronizer = { path = "../synchronizer", features = ["client", "dangerous-skip-chain"] }
